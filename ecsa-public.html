<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ECSA – World Cup Tryouts 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04080f;--surf:#0b1520;--surf2:#10202e;--bdr:#162640;--green:#4ade80;--gdim:rgba(74,222,128,.1);--gold:#fbbf24;--red:#f43f5e;--blue:#38bdf8;--text:#e8edf5;--muted:#4a6280;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;overflow-x:hidden}
.hero{background:linear-gradient(180deg,#07111e,#04080f);border-bottom:1px solid var(--bdr);padding:16px 16px 12px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(74,222,128,.06),transparent 70%);pointer-events:none}
.hero-logo{width:72px;height:72px;border-radius:50%;margin:0 auto 9px;box-shadow:0 0 0 3px rgba(74,222,128,.3),0 0 22px rgba(74,222,128,.2);overflow:hidden}
.hero-logo img{width:100%;height:100%;object-fit:cover}
.hero-line1{font-family:'Oswald',sans-serif;font-size:9px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;margin-bottom:3px}
.hero-title{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--green);letter-spacing:4px;line-height:1}
.hero-title span{color:var(--gold)}
.hero-sub{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:3px;margin-bottom:9px}
.hero-flags{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px}
.hero-flag-item{text-align:center}
.hero-flag-item .hf{font-size:24px;line-height:1;display:block;margin-bottom:2px}
.hero-flag-item .hn{font-family:'Oswald',sans-serif;font-size:8px;font-weight:600;color:var(--muted);letter-spacing:1px}
.hero-sep{width:1px;height:30px;background:var(--bdr);flex-shrink:0}
.refresh-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;background:var(--surf);border-bottom:1px solid var(--bdr);font-size:10px;color:var(--muted)}
.rdot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
/* CAT TABS */
.cat-tabs{display:flex;background:var(--surf);border-bottom:2px solid var(--bdr);overflow-x:auto}
.cat-tabs::-webkit-scrollbar{display:none}
.ct{flex:1;min-width:65px;padding:11px 6px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .25s;text-align:center;position:relative}
.ct.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(251,191,36,.04)}
.ct:hover:not(.on){color:var(--text)}
.ct-dot{position:absolute;top:7px;right:calc(50% - 14px);width:5px;height:5px;border-radius:50%;background:var(--red);animation:blink 1s infinite;display:none}
.ct-dot.show{display:block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
.cat-view{display:none;padding:12px;max-width:840px;margin:0 auto;padding-bottom:32px}
.cat-view.on{display:block}
/* LIVE CARD */
.live-card{background:linear-gradient(135deg,#0b1520,#0e1e2e);border:2px solid var(--red);border-radius:12px;padding:13px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.live-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(244,63,94,.06),transparent 70%);pointer-events:none}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 9px;border-radius:20px;margin-bottom:9px}
.live-bd{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.live-scores{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lsc-team{flex:1;text-align:center}
.lsc-flag{font-size:38px;line-height:1;margin-bottom:3px}
.lsc-name{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.lsc-score{font-family:'Oswald',sans-serif;font-size:56px;font-weight:700;color:var(--green);line-height:1;text-shadow:0 0 22px rgba(74,222,128,.5)}
.lsc-x{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--muted)}
.live-meta{font-size:10px;color:var(--muted);text-align:center;margin-top:5px;letter-spacing:1px;font-family:'Oswald',sans-serif}
/* HALF TIME */
.ht-card{background:linear-gradient(135deg,#0b1520,#0e1e2e);border:2px solid var(--gold);border-radius:12px;padding:13px 16px;margin-bottom:12px}
.ht-badge{display:inline-flex;align-items:center;gap:5px;background:var(--gold);color:#000;font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 9px;border-radius:20px;margin-bottom:9px}
/* NEXT GAME */
.next-card{background:var(--surf);border:1px solid var(--blue);border-radius:10px;padding:11px 14px;margin-bottom:8px;text-align:center}
.next-lbl{font-family:'Oswald',sans-serif;font-size:9px;color:var(--blue);letter-spacing:3px;margin-bottom:7px}
.next-teams{display:flex;align-items:center;justify-content:center;gap:10px}
.next-team{text-align:center}
.next-flag{font-size:28px;line-height:1;margin-bottom:3px}
.next-name{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px}
.next-vs{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--muted)}
/* SCHEDULE */
.s-hd{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;margin-top:14px;display:flex;align-items:center;gap:8px}
.s-hd::after{content:'';flex:1;height:1px;background:var(--bdr)}
.sch-grid{display:flex;flex-direction:column;gap:5px}
.sch-card{background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:8px}
.sch-card.live-now{border-color:var(--red);background:rgba(244,63,94,.04)}
.sch-card.ht-now{border-color:var(--gold);background:rgba(251,191,36,.03)}
.sch-card.done{opacity:.8}
.sch-label{font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;width:52px;flex-shrink:0}
.sch-teams{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.sch-team-flag{font-size:18px;flex-shrink:0}
.sch-team-name{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-vs{font-size:9px;color:var(--muted);flex-shrink:0}
.sch-result{flex-shrink:0;text-align:right;min-width:58px}
.sch-score{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--green)}
.sch-pen{font-size:8px;color:var(--gold);font-family:'Oswald',sans-serif;font-weight:700}
.sch-status{font-size:7px;font-family:'Oswald',sans-serif;letter-spacing:1px;font-weight:700;padding:2px 5px;border-radius:7px;display:inline-block}
.sch-status.live{background:var(--red);color:#fff}
.sch-status.ht{background:var(--gold);color:#000}
.sch-status.done{background:rgba(74,222,128,.1);color:var(--green)}
.sch-status.next{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.2)}
.sch-status.ko{background:rgba(251,191,36,.1);color:var(--gold);border:1px solid rgba(251,191,36,.2)}
/* GOALS LOG */
.glog-pub{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);border-radius:8px;overflow:hidden;margin-top:9px}
.glog-hd{font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 10px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06)}
.gl-row{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
.gl-row:last-child{border-bottom:none}
/* STANDINGS */
.stand-wrap{overflow-x:auto}
.stand-tbl{width:100%;min-width:300px;border-collapse:collapse;background:var(--surf);border:1px solid var(--bdr);border-radius:9px;overflow:hidden}
.stand-tbl th{font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--bdr);text-align:center;background:var(--surf2)}
.stand-tbl th:nth-child(-n+2){text-align:left;padding-left:10px}
.stand-tbl td{padding:8px 6px;border-bottom:1px solid var(--bdr);text-align:center;font-size:12px;font-weight:600}
.stand-tbl td:nth-child(-n+2){text-align:left;padding-left:10px}
.stand-tbl tr:last-child td{border-bottom:none}
.stand-tbl tr.r1 td{background:rgba(251,191,36,.04)}
.pts-big{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--gold)}
/* SCORERS */
.scorers{background:var(--surf);border:1px solid var(--bdr);border-radius:9px;overflow:hidden}
.sc-row{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--bdr)}
.sc-row:last-child{border-bottom:none}
.sc-rank{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;width:18px;text-align:center;color:var(--muted)}
.sc-rank.r1{color:var(--gold)}.sc-rank.r2{color:#e2e8f0}.sc-rank.r3{color:#cd7f32}
.sc-goals{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;color:var(--green)}
/* KO */
.champ-card{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(251,191,36,.03));border:2px solid var(--gold);border-radius:11px;padding:14px;text-align:center;margin-bottom:7px}
.ko-card{background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:10px 12px;margin-bottom:7px}
/* MISC */
.empty{text-align:center;color:var(--muted);padding:20px;font-size:12px}
.footer{text-align:center;padding:16px;font-size:10px;color:var(--muted);letter-spacing:1px}
.footer a{color:var(--green);text-decoration:none}
/* OVERVIEW — all live games */
.overview{padding:12px;max-width:840px;margin:0 auto}
.ov-hd{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;color:var(--red);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.ov-hd::after{content:'';flex:1;height:1px;background:rgba(244,63,94,.2)}
.ov-none{font-family:'Oswald',sans-serif;font-size:12px;color:var(--muted);text-align:center;padding:14px;background:var(--surf);border:1px solid var(--bdr);border-radius:9px;margin-bottom:12px}
.ov-card{background:linear-gradient(135deg,#0b1520,#0e1e2e);border:2px solid var(--red);border-radius:11px;padding:11px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.ov-cat{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;color:var(--red);letter-spacing:2px;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);border-radius:6px;padding:2px 7px;flex-shrink:0}
.ov-teams{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}
.ov-team{text-align:center}
.ov-flag{font-size:26px;line-height:1;margin-bottom:1px}
.ov-name{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px}
.ov-score{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--green);line-height:1}
.ov-x{font-family:'Oswald',sans-serif;font-size:18px;color:var(--muted)}
.ov-meta{font-family:'Oswald',sans-serif;font-size:8px;color:var(--muted);letter-spacing:1px;text-align:center;margin-top:2px}

/* ═══════════ MOBILE OPTIMIZATION ═══════════ */
html{-webkit-text-size-adjust:100%}
@media(max-width:768px){
  .hero{padding:18px 16px 14px}
  .hero-logo{width:80px;height:80px}
  .hero-line1{font-size:10px}
  .hero-title{font-size:32px}
  .hero-sub{font-size:10px}
  .hero-flags .hf{font-size:30px}
  .hero-flags .hn{font-size:10px}
  .refresh-bar{font-size:12px;padding:8px}
  .ct{font-size:16px;padding:13px 8px}
  .ct-dot{width:6px;height:6px}
  .cat-view{padding:13px;padding-bottom:36px}
  .live-card{padding:14px 16px;margin-bottom:13px}
  .live-badge{font-size:11px;padding:4px 11px;margin-bottom:10px}
  .live-bd{width:6px;height:6px}
  .lsc-flag{font-size:46px;margin-bottom:4px}
  .lsc-name{font-size:15px;letter-spacing:2px;margin-bottom:4px}
  .lsc-score{font-size:68px}
  .lsc-x{font-size:32px}
  .live-meta{font-size:12px;margin-top:7px}
  .ht-card{padding:14px 16px}
  .ht-badge{font-size:11px;padding:4px 11px;margin-bottom:10px}
  .next-card{padding:13px 16px;margin-bottom:10px}
  .next-lbl{font-size:11px;margin-bottom:9px}
  .next-flag{font-size:34px;margin-bottom:4px}
  .next-name{font-size:16px}
  .next-vs{font-size:20px}
  .s-hd{font-size:13px;margin-bottom:9px;margin-top:16px}
  .sch-grid{gap:7px}
  .sch-card{padding:10px 13px;gap:9px}
  .sch-label{font-size:11px;width:56px}
  .sch-team-flag{font-size:21px}
  .sch-team-name{font-size:14px}
  .sch-vs{font-size:10px}
  .sch-score{font-size:20px}
  .sch-status{font-size:10px;padding:3px 7px}
  .glog-hd{font-size:11px;padding:7px 12px}
  .gl-row{font-size:14px;padding:8px 12px;gap:8px}
  .stand-tbl th{font-size:11px;padding:9px 7px}
  .stand-tbl td{font-size:14px;padding:10px 7px}
  .pts-big{font-size:19px}
  .sc-row{padding:10px 12px;gap:10px}
  .sc-rank{font-size:15px;width:22px}
  .sc-goals{font-size:18px}
  .champ-card{padding:16px;margin-bottom:9px}
  .ko-card{padding:12px 14px}
  .overview{padding:13px}
  .ov-hd{font-size:12px;margin-bottom:9px}
  .ov-none{font-size:13px;padding:16px}
  .ov-card{padding:12px 14px;margin-bottom:10px;gap:11px}
  .ov-cat{font-size:12px;padding:3px 9px}
  .ov-flag{font-size:30px;margin-bottom:2px}
  .ov-name{font-size:12px}
  .ov-score{font-size:38px}
  .ov-x{font-size:22px}
  .ov-meta{font-size:10px}
}
@media(max-width:380px){
  .lsc-score{font-size:58px}
  .lsc-flag{font-size:38px}
  .ov-score{font-size:32px}
  .ov-flag{font-size:26px}
  .stand-tbl th{font-size:10px;padding:8px 5px}
  .stand-tbl td{font-size:13px;padding:9px 5px}
}

@media(max-width:460px){.lsc-score{font-size:46px}.lsc-flag{font-size:32px}.hero-title{font-size:24px}}
</style>

  <button class="ct" id="ct-U10" onclick="showCat('U10')">U10<div class="ct-dot" id="dot-U10"></div></button>
  <button class="ct" id="ct-U12" onclick="showCat('U12')">U12<div class="ct-dot" id="dot-U12"></div></button>
  <button class="ct" id="ct-U14" onclick="showCat('U14')">U14<div class="ct-dot" id="dot-U14"></div></button>
</div>

<div id="view-all" class="cat-view on"></div>
<div id="view-U8"  class="cat-view"></div>
<div id="view-U10" class="cat-view"></div>
<div id="view-U12" class="cat-view"></div>
<div id="view-U14" class="cat-view"></div>

<div style="text-align:center;padding:20px 16px 8px;max-width:840px;margin:0 auto">
  <a href="ecsa-admin.html" style="display:inline-block;background:var(--green);color:#000;font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;text-decoration:none;padding:16px 36px;border-radius:12px;box-shadow:0 0 24px rgba(74,222,128,.35);width:100%;max-width:340px;text-align:center">&#x1F512; COACH LOGIN</a>
  <div style="font-size:10px;color:var(--muted);margin-top:7px">Coaches &amp; Admin access</div>
</div>
<div class="footer">&#x26BD; ECSA &middot; Eagle Creek Soccer Academy &middot; World Cup Tryouts 2026</div>

<script>

/* ═══════════════════════════════════════════════════════
   FIREBASE CONFIG — mesmas credenciais do admin
   ═══════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "COLE_AQUI",
  authDomain:        "COLE_AQUI",
  databaseURL:       "COLE_AQUI",
  projectId:         "COLE_AQUI",
  storageBucket:     "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId:             "COLE_AQUI"
};

function initFirebasePub(){
  try{
    if(FIREBASE_CONFIG.apiKey==='COLE_AQUI'){console.warn('Firebase não configurado');return;}
    firebase.initializeApp(FIREBASE_CONFIG);
    firebase.database().ref('ecsa2026').on('value',snap=>{
      const d=snap.val();if(!d)return;
      if(d.athletes)athletes=d.athletes||[];
      if(d.gameStore)CATS.forEach(c=>{if(d.gameStore[c])gameStore[c]=d.gameStore[c];});
      if(d.ts){
        const sec=Math.floor((Date.now()-d.ts)/1000);
        const el=document.getElementById('refreshLbl');
        if(el)el.innerHTML='<b style="color:var(--green)">☁️ Firebase</b> &middot; '+(sec<5?'agora mesmo':sec+'s atrás');
        // Sync para localStorage
        try{localStorage.setItem('e2_ath',JSON.stringify(athletes));localStorage.setItem('e2_gs',JSON.stringify(gameStore));localStorage.setItem('e2_ts',String(d.ts));}catch(e){}
      }
      renderAll();
    });
  }catch(e){console.error('Firebase pub error:',e);}
}

const SCHEDULE=[
  {idx:0,label:'Game 1',ta:'USA',tb:'Spain',type:'group'},
  {idx:1,label:'Game 2',ta:'Brazil',tb:'Argentina',type:'group'},
  {idx:2,label:'Game 3',ta:'Argentina',tb:'USA',type:'group'},
  {idx:3,label:'Game 4',ta:'Brazil',tb:'Spain',type:'group'},
  {idx:4,label:'Game 5',ta:'Spain',tb:'Argentina',type:'group'},
  {idx:5,label:'Game 6',ta:'Brazil',tb:'USA',type:'group'},
  {idx:6,label:'3rd Place',ta:null,tb:null,type:'knockout'},
  {idx:7,label:'Championship',ta:null,tb:null,type:'final'},
];
const TEAMS={
  USA:      {flag:'&#x1F1FA;&#x1F1F8;',name:'USA'},
  Brazil:   {flag:'&#x1F1E7;&#x1F1F7;',name:'Brazil'},
  Argentina:{flag:'&#x1F1E6;&#x1F1F7;',name:'Argentina'},
  Spain:    {flag:'&#x1F1EA;&#x1F1F8;',name:'Spain'},
};
const CATS=['U8','U10','U12','U14'];
let activeCat='all',athletes=[],gameStore={};
CATS.forEach(c=>gameStore[c]={});

function loadData(){
  try{athletes=JSON.parse(localStorage.getItem('e2_ath')||'[]');}catch(e){}
  try{const gs=JSON.parse(localStorage.getItem('e2_gs')||'null');if(gs)CATS.forEach(c=>{if(gs[c])gameStore[c]=gs[c];});}catch(e){}
}
function showCat(cat){
  activeCat=cat;
  document.querySelectorAll('.ct').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.cat-view').forEach(v=>v.classList.remove('on'));
  document.getElementById('ct-'+cat).classList.add('on');
  document.getElementById('view-'+cat).classList.add('on');
}
function gScore(gs,ta,tb){return{sA:(gs[ta]&&gs[ta].goals)?gs[ta].goals.length:0,sB:(gs[tb]&&gs[tb].goals)?gs[tb].goals.length:0};}
function pScore(gs,ta,tb){return{pA:(gs[ta]&&gs[ta].penalties)?gs[ta].penalties.filter(p=>p.scored).length:0,pB:(gs[tb]&&gs[tb].penalties)?gs[tb].penalties.filter(p=>p.scored).length:0};}

function computeSt(cat){
  const st={};Object.keys(TEAMS).forEach(t=>{st[t]={team:t,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
  for(let i=0;i<6;i++){
    const gs=gameStore[cat]&&gameStore[cat][i];
    if(!gs||(gs.status!=='finalized'&&gs.status!=='ended'))continue;
    const ta=gs.ta,tb=gs.tb;if(!st[ta]||!st[tb])continue;
    const{sA,sB}=gScore(gs,ta,tb);
    st[ta].gf+=sA;st[ta].ga+=sB;st[tb].gf+=sB;st[tb].ga+=sA;
    if(sA>sB){st[ta].w++;st[tb].l++;st[ta].pts+=3;}
    else if(sA<sB){st[tb].w++;st[ta].l++;st[tb].pts+=3;}
    else{st[ta].d++;st[tb].d++;st[ta].pts+=1;st[tb].pts+=1;}
  }return st;
}
function sortedSt(cat){
  return Object.values(computeSt(cat)).sort((a,b)=>{
    if(b.pts!==a.pts)return b.pts-a.pts;
    const dA=a.gf-a.ga,dB=b.gf-b.ga;if(dB!==dA)return dB-dA;
    if(b.gf!==a.gf)return b.gf-a.gf;return a.team.localeCompare(b.team);
  });
}

// RENDER ALL (overview tab — all live games across categories)
function renderAll(){
  loadData();
  renderOverview();
  CATS.forEach(c=>renderCat(c));
  updateDots();
  updateRefLabel();
}

function renderOverview(){
  const view=document.getElementById('view-all');
  const s=[];
  // Collect all live/ended games across all categories
  const liveGames=[];
  CATS.forEach(cat=>{
    const cd=gameStore[cat]||{};
    SCHEDULE.forEach(sc=>{
      const gs=cd[sc.idx];
      if(!gs)return;
      const isLive=gs.status==='active';
      const isHT=gs.status==='active'&&gs.timerPhase===2;
      const isEnded=gs.status==='ended';
      if(isLive||isEnded){
        const ta=gs.ta,tb=gs.tb;
        if(!ta||!tb)return;
        const{sA,sB}=gScore(gs,ta,tb);
        const phase=gs.timerPhase;
        const phLabel=phase===1?'1st Half':phase===2?'Half Time':phase===3?'2nd Half':phase===0?'Starting...':'In Progress';
        liveGames.push({cat,sc,gs,ta,tb,sA,sB,phLabel,isHT,isEnded});
      }
    });
  });

  s.push(`<div class="overview">`);
  s.push(`<div class="ov-hd"><span class="live-bd" style="width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1s infinite;display:inline-block"></span>LIVE NOW (${liveGames.filter(g=>!g.isEnded).length} game${liveGames.filter(g=>!g.isEnded).length!==1?'s':''})</div>`);

  if(!liveGames.length){
    s.push(`<div class="ov-none">&#x26BD; No games in progress right now</div>`);
  }else{
    liveGames.forEach(({cat,sc,gs,ta,tb,sA,sB,phLabel,isHT,isEnded})=>{
      const allGoals=[...(gs[ta]&&gs[ta].goals||[]).map(g=>({...g,t:ta})),...(gs[tb]&&gs[tb].goals||[]).map(g=>({...g,t:tb}))];
      const recentGoals=allGoals.slice(-3).reverse();
      s.push(`<div class="ov-card" style="${isEnded?'border-color:var(--gold)':isHT?'border-color:var(--gold)':''}">
        <div>
          <div class="ov-cat" style="${isEnded?'color:var(--gold);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.1)':''}">${cat}</div>
          <div style="font-family:'Oswald',sans-serif;font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:1px">${sc.label}</div>
          <div style="font-size:8px;color:${isEnded?'var(--gold)':isHT?'var(--gold)':'var(--red)'};font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:1px;margin-top:2px">${isEnded?'CONFIRM':'LIVE'}</div>
        </div>
        <div class="ov-teams">
          <div class="ov-team"><div class="ov-flag">${TEAMS[ta]?.flag||''}</div><div class="ov-name">${ta}</div></div>
          <div style="text-align:center"><div class="ov-score">${sA}<span style="color:var(--muted);font-size:20px">&times;</span>${sB}</div><div class="ov-meta">${phLabel}</div></div>
          <div class="ov-team"><div class="ov-flag">${TEAMS[tb]?.flag||''}</div><div class="ov-name">${tb}</div></div>
        </div>
        ${recentGoals.length?`<div style="min-width:90px;max-width:90px">${recentGoals.map(g=>`<div style="font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">&#x26BD; ${TEAMS[g.t]?.flag||''} ${g.name||''}</div>`).join('')}</div>`:''}
      </div>`);
    });
  }

  // Summary grid
  s.push(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px">`);
  CATS.forEach(cat=>{
    const cd=gameStore[cat]||{};
    const live=SCHEDULE.find(sc=>cd[sc.idx]&&cd[sc.idx].status==='active');
    const finalized=SCHEDULE.filter(sc=>cd[sc.idx]&&cd[sc.idx].status==='finalized').length;
    const sorted=sortedSt(cat);
    const leader=sorted[0];
    s.push(`<div style="background:var(--surf);border:1px solid ${live?'var(--red)':'var(--bdr)'};border-radius:9px;padding:9px 11px">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
        <span style="font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;color:var(--gold)">${cat}</span>
        ${live?`<span style="font-size:7px;background:var(--red);color:#fff;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:1px;padding:1px 5px;border-radius:7px">&#x25CF; LIVE</span>`:`<span style="font-size:9px;color:var(--muted)">${finalized}/6 done</span>`}
      </div>
      ${leader?`<div style="font-size:10px;color:var(--muted)">&#x1F947; <b style="color:var(--text)">${TEAMS[leader.team]?.flag} ${leader.team}</b> &nbsp; <span style="color:var(--gold);font-family:'Oswald',sans-serif;font-weight:700">${leader.pts}pts</span></div>`:'<div style="font-size:10px;color:var(--muted)">No results yet</div>'}
    </div>`);
  });
  s.push(`</div></div>`);

  view.innerHTML=s.join('');
}

function renderCat(cat){
  const cd=gameStore[cat]||{};const view=document.getElementById('view-'+cat);
  const s=[];

  // Find live/ended game
  const liveEntry=SCHEDULE.find(sc=>cd[sc.idx]&&cd[sc.idx].status==='active');
  const endedEntry=SCHEDULE.find(sc=>cd[sc.idx]&&cd[sc.idx].status==='ended');
  const activeEntry=liveEntry||endedEntry;

  if(activeEntry){
    const gs=cd[activeEntry.idx];const ta=gs.ta,tb=gs.tb;
    if(ta&&tb){
      const{sA,sB}=gScore(gs,ta,tb);
      const phase=gs.timerPhase;
      const isHT=phase===2;
      const isEnded=gs.status==='ended';
      const phLabel=phase===1?'1st Half in progress':phase===2?'Half Time Break':phase===3?'2nd Half in progress':isEnded?'Awaiting confirmation':'In Progress';
      const allGoals=[...(gs[ta]&&gs[ta].goals||[]).map(g=>({...g,t:ta})),...(gs[tb]&&gs[tb].goals||[]).map(g=>({...g,t:tb}))];
      const recentGoals=allGoals.slice(-5).reverse();

      const cardCls=isHT||isEnded?'ht-card':'live-card';
      const badgeHTML=isEnded?`<div class="ht-badge">&#x23F8; CONFIRM SCORE</div>`:isHT?`<div class="ht-badge">&#x23F8; HALF TIME</div>`:`<div class="live-badge"><span class="live-bd"></span>LIVE NOW</div>`;
      s.push(`<div class="${cardCls}">${badgeHTML}
        <div class="live-scores">
          <div class="lsc-team"><div class="lsc-flag">${TEAMS[ta]?.flag||''}</div><div class="lsc-name">${ta}</div><div class="lsc-score">${sA}</div></div>
          <div class="lsc-x">&times;</div>
          <div class="lsc-team"><div class="lsc-flag">${TEAMS[tb]?.flag||''}</div><div class="lsc-name">${tb}</div><div class="lsc-score">${sB}</div></div>
        </div>
        <div class="live-meta">${activeEntry.label} &middot; ${cat} &middot; ${phLabel}</div>
        ${recentGoals.length?`<div class="glog-pub"><div class="glog-hd">&#x26BD; Goals (${allGoals.length})</div>${recentGoals.map(g=>`<div class="gl-row"><span>&#x26BD;</span><span>${TEAMS[g.t]?.flag||''}</span><span style="font-weight:600;flex:1">${g.name||''}</span><span style="background:rgba(74,222,128,.15);color:var(--green);font-family:'Oswald',sans-serif;font-size:9px;padding:1px 5px;border-radius:7px">#${g.num||''}</span></div>`).join('')}</div>`:''}
      </div>`);
    }
  }else{
    // Find next upcoming game
    const nextGame=SCHEDULE.find(sc=>{const gs=cd[sc.idx];return !gs||gs.status==='upcoming';});
    if(nextGame){
      const gs=cd[nextGame.idx]||{};const ta=gs.ta||nextGame.ta,tb=gs.tb||nextGame.tb;
      if(ta&&tb)s.push(`<div class="next-card"><div class="next-lbl">&#x23ED; NEXT GAME &middot; ${cat} &middot; ${nextGame.label}</div>
        <div class="next-teams">
          <div class="next-team"><div class="next-flag">${TEAMS[ta]?.flag||''}</div><div class="next-name">${ta}</div></div>
          <div class="next-vs">VS</div>
          <div class="next-team"><div class="next-flag">${TEAMS[tb]?.flag||''}</div><div class="next-name">${tb}</div></div>
        </div></div>`);
    }
  }

  // Schedule
  s.push(`<div class="s-hd">&#x1F4C5; Schedule &middot; ${cat}</div><div class="sch-grid">`);
  SCHEDULE.forEach(sc=>{
    const gs=cd[sc.idx];const ta=gs?gs.ta:sc.ta,tb=gs?gs.tb:sc.tb;
    const isLive=gs&&gs.status==='active';
    const isHT=isLive&&gs.timerPhase===2;
    const isEnded=gs&&gs.status==='ended';
    const isFin=gs&&gs.status==='finalized';
    let stHTML='';
    if(isFin){const{sA,sB}=gScore(gs,ta||'',tb||'');stHTML=`<div class="sch-score">${sA}-${sB}${gs.penaltyWinner?'<span class="sch-pen">(p)</span>':''}</div><span class="sch-status done">FINAL</span>`;}
    else if(isEnded){const{sA,sB}=gScore(gs,ta||'',tb||'');stHTML=`<div class="sch-score">${sA}-${sB}</div><span class="sch-status ht">CONFIRM</span>`;}
    else if(isHT){const{sA,sB}=gScore(gs,ta||'',tb||'');stHTML=`<div class="sch-score">${sA}-${sB}</div><span class="sch-status ht">HT</span>`;}
    else if(isLive){const{sA,sB}=gScore(gs,ta||'',tb||'');stHTML=`<div class="sch-score">${sA}-${sB}</div><span class="sch-status live">&#x25CF; LIVE</span>`;}
    else if(sc.type!=='group')stHTML=`<span class="sch-status ko">${sc.type==='final'?'CHAMP.':'3RD PL.'}</span>`;
    else stHTML=`<span class="sch-status next">UPCOMING</span>`;
    let cls='sch-card';if(isLive&&!isHT)cls+=' live-now';if(isHT)cls+=' ht-now';if(isFin)cls+=' done';
    s.push(`<div class="${cls}"><div class="sch-label">${sc.label}</div>
      <div class="sch-teams">
        <span class="sch-team-flag">${ta?TEAMS[ta]?.flag||'?':'&#x2753;'}</span>
        <span class="sch-team-name">${ta||'TBD'}</span>
        <span class="sch-vs">vs</span>
        <span class="sch-team-flag">${tb?TEAMS[tb]?.flag||'?':'&#x2753;'}</span>
        <span class="sch-team-name">${tb||'TBD'}</span>
      </div>
      <div class="sch-result">${stHTML}</div>
    </div>`);
  });
  s.push('</div>');

  // Finalized KO results
  const fin6=cd[6]&&cd[6].status==='finalized',fin7=cd[7]&&cd[7].status==='finalized';
  if(fin6||fin7){s.push(`<div class="s-hd">&#x1F3C5; Results</div>`);}
  if(fin7){const g=cd[7];const ta=g.ta,tb=g.tb;const{sA,sB}=gScore(g,ta,tb);const champ=g.penaltyWinner||((sA>sB)?ta:(sB>sA)?tb:null);const pen=g.penaltyWinner?' (pen.)':'';
    s.push(`<div class="champ-card"><div style="font-family:'Oswald',sans-serif;font-size:9px;color:var(--gold);letter-spacing:3px;margin-bottom:4px">&#x1F3C6; CHAMPION &middot; ${cat}</div>
      <div style="font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--gold)">${champ?TEAMS[champ]?.flag+' '+champ:'&#x1F3C6;'}</div>
      <div style="font-size:11px;margin-top:4px;color:var(--muted)">${TEAMS[ta]?.flag} ${ta} ${sA}&times;${sB} ${TEAMS[tb]?.flag} ${tb}${pen}</div></div>`);}
  if(fin6){const g=cd[6];const ta=g.ta,tb=g.tb;const{sA,sB}=gScore(g,ta,tb);const pen=g.penaltyWinner?' (pen.)':'';
    s.push(`<div class="ko-card"><div style="font-size:8px;color:var(--muted);letter-spacing:2px;font-family:'Oswald',sans-serif;margin-bottom:3px">3RD PLACE</div>
      <div style="font-size:15px;font-weight:700;font-family:'Oswald',sans-serif">${TEAMS[ta]?.flag} ${ta} ${sA}&times;${sB} ${TEAMS[tb]?.flag} ${tb}${pen}</div></div>`);}

  // Standings
  const sorted=sortedSt(cat);const posE=['&#x1F947;','&#x1F948;','&#x1F949;','4th'];const trCls=['r1','r2','',''];
  s.push(`<div class="s-hd">&#x1F3C6; Standings &middot; ${cat}</div>
    <div class="stand-wrap"><table class="stand-tbl">
      <thead><tr><th>#</th><th>Team</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead>
      <tbody>${sorted.map((st,i)=>{const gd=st.gf-st.ga;return`<tr class="${trCls[i]||''}"><td>${posE[i]||i+1}</td><td><b>${TEAMS[st.team]?.flag} ${st.team}</b></td><td>${st.w}</td><td>${st.d}</td><td>${st.l}</td><td>${st.gf}</td><td>${st.ga}</td>
        <td style="color:${gd>0?'var(--green)':gd<0?'var(--red)':'var(--muted)'}">${gd>0?'+':''}${gd}</td><td class="pts-big">${st.pts}</td></tr>`;}).join('')}</tbody></table>
      <div style="font-size:9px;color:var(--muted);margin-top:4px">Win=3pts &middot; Draw=1pt &middot; Loss=0pts</div></div>`);

  // Top scorers
  const scmap={};SCHEDULE.forEach(sc=>{const gs=cd[sc.idx];if(!gs)return;['ta','tb'].forEach(k=>{const t=gs[k];if(gs[t]&&gs[t].goals)gs[t].goals.forEach(g=>{if(!g.name)return;if(!scmap[g.pid])scmap[g.pid]={name:g.name,num:g.num,team:g.team,total:0};scmap[g.pid].total++;});});});
  const scorers=Object.values(scmap).sort((a,b)=>b.total-a.total).slice(0,10);const rkc=['r1','r2','r3'];
  s.push(`<div class="s-hd">&#x26BD; Top Scorers &middot; ${cat}</div>`);
  s.push(scorers.length?`<div class="scorers">${scorers.map((sc,i)=>`<div class="sc-row"><div class="sc-rank ${rkc[i]||''}">${i+1}</div>
    <div style="font-size:17px">${TEAMS[sc.team]?.flag||''}</div>
    <div style="flex:1;font-size:12px;font-weight:600">${sc.name} <span style="color:var(--muted);font-size:9px">#${sc.num} &middot; ${sc.team}</span></div>
    <div class="sc-goals">${sc.total}<small> goal${sc.total>1?'s':''}</small></div>
  </div>`).join('')}</div>`:`<div class="empty">&#x26BD; No goals yet</div>`);

  view.innerHTML=s.join('');
}

function updateDots(){
  CATS.forEach(cat=>{
    const cd=gameStore[cat]||{};
    const isLive=SCHEDULE.some(sc=>cd[sc.idx]&&cd[sc.idx].status==='active');
    const dot=document.getElementById('dot-'+cat);if(dot)dot.classList.toggle('show',isLive);
  });
  const anyLive=CATS.some(cat=>{const cd=gameStore[cat]||{};return SCHEDULE.some(sc=>cd[sc.idx]&&cd[sc.idx].status==='active');});
  const dotAll=document.getElementById('dot-all');if(dotAll)dotAll.classList.toggle('show',anyLive);
}
function updateRefLabel(){
  const ts=localStorage.getItem('e2_ts');
  if(ts){const d=Math.floor((Date.now()-parseInt(ts))/1000);document.getElementById('refreshLbl').textContent='Updated: '+(d<60?d+'s':Math.floor(d/60)+'m')+' ago &middot; Auto-refresh';}
}

let lastTs='';
function autoRefresh(){
  const ts=localStorage.getItem('e2_ts')||'';
  if(ts!==lastTs){lastTs=ts;renderAll();}
  else{updateDots();updateRefLabel();}
}
window.addEventListener('storage',e=>{if(['e2_gs','e2_ts'].includes(e.key))renderAll();});
renderAll();
setInterval(autoRefresh,2000);
initFirebasePub();
</script>
</body>
</html>
